[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spendlens"
version = "1.0.0"
description = "Turn a bank-statement CSV into spending insight: categories, subscriptions, anomalies and charts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Talha Arshad" }]
dependencies = ["pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff==0.16.9"]

[project.scripts]
spendlens = "spendlens.cli:main"

[tool.setuptools]
packages = ["spendlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
